services:
  postgres:
    image: postgres:16
    container_name: darkstore-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkstore
      POSTGRES_PASSWORD: darkstore
      POSTGRES_DB: darkstore
    ports:
      # Host port 5432 is commonly already taken by another local Postgres,
      # so this maps to 55432 on the host; the container's own port stays 5432.
      - "55432:5432"
    volumes:
      - darkstore-os-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstore -d darkstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  darkstore-os-pgdata:
