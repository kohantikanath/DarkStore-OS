<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DarkStore OS — deploy check</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    .ok { color: #16a34a; }
    .fail { color: #dc2626; }
    .pending { color: #64748b; }
    pre { background: #f1f5f9; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>DarkStore OS — Phase 4 deploy check</h1>
  <p>This page only exists to prove the backend, database, and CORS/WebSocket
     wiring work end-to-end across Render + Neon + Vercel. It is replaced
     entirely by the real frontend in Phase 5+.</p>

  <h2>REST: <code>GET /api/health</code></h2>
  <p id="health" class="pending">checking…</p>
  <pre id="health-body"></pre>

  <h2>WebSocket: <code>/ws</code></h2>
  <p id="ws" class="pending">connecting…</p>

  <script>
    const API_URL = "__API_URL__";
    const WS_URL = "__WS_URL__";

    const healthEl = document.getElementById("health");
    const healthBodyEl = document.getElementById("health-body");
    const wsEl = document.getElementById("ws");

    fetch(API_URL + "/api/health")
      .then((res) => res.json().then((body) => ({ status: res.status, body })))
      .then(({ status, body }) => {
        healthEl.textContent = `OK (HTTP ${status})`;
        healthEl.className = "ok";
        healthBodyEl.textContent = JSON.stringify(body, null, 2);
      })
      .catch((err) => {
        healthEl.textContent = "FAILED: " + err.message;
        healthEl.className = "fail";
      });

    try {
      const socket = new WebSocket(WS_URL);
      socket.onopen = () => {
        wsEl.textContent = "connected — subscribing to \"ops\"…";
        socket.send(JSON.stringify({ type: "subscribe", channel: "ops" }));
      };
      socket.onmessage = (event) => {
        wsEl.textContent = "connected, receiving events ✓";
        wsEl.className = "ok";
        console.log("ws event:", event.data);
      };
      socket.onerror = () => {
        wsEl.textContent = "FAILED to connect";
        wsEl.className = "fail";
      };
      socket.onclose = () => {
        if (wsEl.className !== "ok") {
          wsEl.textContent = "closed before any event arrived";
          wsEl.className = "fail";
        }
      };
    } catch (err) {
      wsEl.textContent = "FAILED: " + err.message;
      wsEl.className = "fail";
    }
  </script>
</body>
</html>
